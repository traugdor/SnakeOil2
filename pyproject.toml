[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snakeoil2"
version = "0.1.0"
description = "SnakeOil2, a dual-bank polyphonic MIDI synthesizer in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
app = ["sounddevice>=0.4.6", "mido>=1.3", "python-rtmidi>=1.5", "PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
snakeoil2 = "snakeoil2.app.main:main"

[tool.setuptools.packages.find]
include = ["snakeoil2*"]
